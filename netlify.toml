[build]
  publish = "."

# Cabeceras para SEO y rendimiento.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# Cache largo para assets estáticos.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML siempre fresco para que el cambio en meta tags llegue rápido a Google.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Share links de tracks: djfreeapp.ar/s/<slug> → Netlify Function que devuelve
# HTML con Open Graph tags reales (artist+title+cover). Sin esto, WhatsApp/
# Telegram muestran solo "DJ Free App" porque no hay metadata específica del
# track en el HTML. La function llama al server para obtener la metadata,
# arma el HTML con OG tags, y mete un meta-refresh hacia app.djfreeapp.ar.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/share"
  status = 200
  force = true

# Agente Windows: el binario vive en la app (no duplicamos 55MB en la landing).
# La URL pública djfreeapp.ar/GrooveSyncAgent.exe redirige al binario real.
[[redirects]]
  from = "/GrooveSyncAgent.exe"
  to = "https://app.djfreeapp.ar/GrooveSyncAgent.exe"
  status = 302
  force = true
