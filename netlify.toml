[build]
  publish = "."

# Cabeceras para SEO y rendimiento.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# CORS abierto para el manifest del agente: app.djfreeapp.ar lo fetchea
# para chequear updates y sin estos headers el browser bloquea.
[[headers]]
  for = "/agent/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Cache-Control = "public, max-age=60, must-revalidate"

# Permitir CORS para que la app lea la versión del agente
[[headers]]
  for = "/agent/version.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET"
    Access-Control-Allow-Headers = "Content-Type"

# Cache largo para assets estáticos.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML siempre fresco para que el cambio en meta tags llegue rápido a Google.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Share links de tracks: djfreeapp.ar/s/<slug> → Netlify Function que devuelve
# HTML con Open Graph tags reales (artist+title+cover). Sin esto, WhatsApp/
# Telegram muestran solo "DJ Free App" porque no hay metadata específica del
# track en el HTML. La function llama al server para obtener la metadata,
# arma el HTML con OG tags, y mete un meta-refresh hacia app.djfreeapp.ar.
[[redirects]]
  from = "/s/*"
  to = "/.netlify/functions/share"
  status = 200
  force = true

# Agente Windows: redirigimos a la latest release de GitHub. Asi cada vez
# que pusheamos un tag nuevo (v2.x.0) el download publico apunta solo a la
# version mas nueva — no hay que re-subir el binario al hosting.
[[redirects]]
  from = "/GrooveSyncAgent.exe"
  to = "https://github.com/arenazl/slsk-agent/releases/latest/download/GrooveSyncAgent.exe"
  status = 302
  force = true

# Agente macOS: idem para el zip.
[[redirects]]
  from = "/GrooveSyncAgent-macOS.zip"
  to = "https://github.com/arenazl/slsk-agent/releases/latest/download/GrooveSyncAgent-macOS.zip"
  status = 302
  force = true
